<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRCCS Mobile App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
:root{
 --bar:#0B0B0C;
 --bg:#F1F3F4;
 --card:#FFFFFF;
 --blue:#4285F4;
 --blue-dark:#1A56C4;
 --orange:#FF6D2A;
 --text:#202124;
 --text-soft:#5F6368;
 --text-faint:#9AA0A6;
 --border:#E1E3E6;
 --green:#1B8A4C;
 --red:#D93025;
 --warn:#F2A600;
 --light:#EAF1FB;
 --muted:#5F6368
}
*{
 box-sizing:border-box;
 font-family:'Roboto',Arial,sans-serif
}
.mono{font-family:'Roboto Mono',monospace}

/* ===== BODY ===== */
body{
 margin:0;
 background:#DADCE0;
 display:flex;
 justify-content:center;
 font-size:13px;
 color:var(--text);
}

/* ===== PHONE FRAME ===== */
.phone{
 width:100%;
 max-width:480px;
 height:100vh;          /* dvh hata do */
 background:var(--bg);
 display:flex;
 flex-direction:column;
 margin:auto;
}
/* ===== LOGIN ===== */
.login{
 flex:1;
 display:flex;
 align-items:center;
 justify-content:center
}
.login-box{
 background:#fff;
 width:90%;
 padding:26px 22px;
 border-radius:10px;
 border:1px solid var(--border);
 box-shadow:0 8px 24px rgba(0,0,0,.12);
 text-align:center
}
.login-box h2{
 margin:0 0 4px;
 font-size:17px;
 font-weight:900;
 color:var(--text);
 letter-spacing:-.01em
}
.login-box input{
 width:100%;
 padding:11px 10px;
 margin-top:12px;
 border-radius:8px;
 border:1px solid var(--border);
 font-family:'Roboto Mono',monospace;
 font-size:13px;
 background:var(--bg);
 outline:none
}
.login-box input:focus{border-color:var(--blue)}
.login-box button{
 width:100%;
 margin-top:18px;
 padding:12px;
 background:var(--blue);
 color:#fff;
 border:none;
 border-radius:8px;
 font-weight:700;
 font-size:12.5px;
 letter-spacing:.03em;
 text-transform:uppercase;
 cursor:pointer
}
.login-box button:active{background:var(--blue-dark)}
.err{
 color:var(--red);
 font-size:11.5px;
 font-weight:500;
 margin-top:10px
}

/* ===== HEADER (FIXED) ===== */
.header{
 background:var(--bar);
 color:#fff;
 padding:14px 16px;
 position:sticky;
 top:0;
 z-index:10;
 height:96px;     /* 🔑 fixed height */
}
.header h1{
 font-size:17px;
 font-weight:900;
 letter-spacing:-.01em;
 margin:0
}
.header span{
 font-size:11px;
 color:var(--text-faint);
 opacity:1
}
.top-actions{
 display:flex;
 gap:8px;
 margin-top:10px
}
.search{
 flex:1;
 border:none;
 border-radius:8px;
 padding:8px 12px;
 font-size:12px;
 font-family:'Roboto',sans-serif;
 background:rgba(255,255,255,.1);
 color:#fff;
}
.search::placeholder{color:var(--text-faint)}
.icon-btn{
 width:34px;
 height:34px;
 background:rgba(255,255,255,.12);
 border-radius:8px;
 display:flex;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 color:#fff;
}

/* ===== CONTENT (ONLY SCROLL AREA) ===== */
.content{
 flex:1;
 overflow-y:auto;
 padding:14px;
 padding-bottom:80px;   /* 🔥 important */
 -webkit-overflow-scrolling:touch;
 scroll-behavior: smooth;
}
/* ===== CARD ===== */
.card{
 background:var(--card);
 border:1px solid var(--border);
 border-left:4px solid var(--blue);
 border-radius:8px;
 padding:16px;
 box-shadow:0 1px 3px rgba(0,0,0,.05)
}
.acc-type{
 font-size:11.5px;
 color:var(--text-soft);
 text-transform:uppercase;
 letter-spacing:.03em;
}
.acc-no{
 font-family:'Roboto Mono',monospace;
 font-weight:700;
 font-size:14px;
 margin:4px 0 8px
}
.balance{
 font-family:'Roboto Mono',monospace;
 font-size:24px;
 font-weight:900;
 color:var(--blue-dark)
}

/* ===== CREDIT / DEBIT BOX ===== */
.amount-box{
 flex:1;
 border-radius:10px;
 padding:8px;
 text-align:center
}

/* ===== MINI ACTIONS ===== */
.mini-actions{
 display:flex;
 justify-content:space-between;
 margin-top:16px;
 padding-top:14px;
 border-top:1px solid #F0F1F2;
}
.mini{
 text-align:center;
 font-size:10.5px;
 color:var(--text-soft);
 font-weight:500;
 cursor:pointer;
}
.mini div{
 width:38px;
 height:38px;
 background:var(--light);
 border-radius:8px;
 margin:auto auto 6px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:var(--blue)
}

/* ===== SECTION ===== */
.section{
 margin-top:20px
}
.section h3{
 font-size:12px;
 font-weight:700;
 color:var(--text-soft);
 text-transform:uppercase;
 letter-spacing:.04em;
 margin-bottom:10px
}

/* ===== GRID ===== */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
 gap:10px;
}
.item{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:8px;
 padding:12px 4px;
 text-align:center;
 font-size:11px;
 font-weight:500;
 color:var(--text-soft);
 cursor:pointer;
}
.item div{
 width:36px;
 height:36px;
 background:var(--light);
 border-radius:8px;
 margin:0 auto 6px;
 display:flex;
 align-items:center;
 justify-content:center;
 color:var(--blue)
}

/* ===== FOOTER / BOTTOM NAV (FIXED) ===== */
.bottom{
 background:var(--bar);
 border-top:none;
 display:flex;
 justify-content:space-around;
 padding:10px 0 8px;
 position:fixed;        /* 🔥 change */
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:100%;
 max-width:480px;
 z-index:100;
 height:60px;
}
.nav{
 text-align:center;
 font-size:9.5px;
 color:var(--text-faint);
 font-weight:500;
 cursor:pointer;
}
.nav span{
 width:26px;
 height:26px;
 background:rgba(255,255,255,.08);
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 margin:auto;
 font-size:12px;
}
.nav.active{
 color:#fff;
 font-weight:700;
}
.nav.active span{
 background:var(--blue);
 color:#fff
}

/* ===== MODAL ===== */
.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.5);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:50
}
.modal-box{
 width:260px;
 background:#fff;
 border-radius:10px;
 border:1px solid var(--border);
 padding:22px 20px;
 text-align:center
}
.modal-box h3{
 font-size:15px;
 font-weight:700;
 color:var(--text);
}

/* ===== HISTORY / STATEMENT ===== */

.history-title{
 font-size:15px;
 font-weight:700;
 color:var(--text);
 margin-bottom:12px
}

/* transaction card */
.txn{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:8px;
 padding:11px 12px;
 margin-bottom:8px;
}
.txn.credit{border-left:4px solid var(--green)}
.txn.debit{border-left:4px solid var(--red)}

.txn-top{
 display:flex;
 justify-content:space-between;
 align-items:center
}
.txn-type{
 font-size:11.5px;
 font-weight:700;
 color:var(--text-soft);
 letter-spacing:.03em;
}
.txn-amt{
 font-family:'Roboto Mono',monospace;
 font-weight:700;
 font-size:13.5px;
}
.txn-amt.credit{color:var(--green)}
.txn-amt.debit{color:var(--red)}

.txn-date{
 font-size:11px;
 color:var(--text-faint);
 margin-top:4px;
 font-family:'Roboto Mono',monospace;
}

/* statement box */
.statement-box{
 background:var(--card);
 border:1px solid var(--border);
 border-left:4px solid var(--orange);
 border-radius:8px;
 padding:16px;
}
.statement-box h3{
 font-size:14px;
 font-weight:700;
 color:var(--text);
}
.statement-box label{
 font-size:11.5px;
 color:var(--text-soft);
 font-weight:500;
}
.statement-box input{
 width:100%;
 padding:9px 10px;
 margin-top:4px;
 margin-bottom:10px;
 border-radius:8px;
 border:1px solid var(--border);
 font-family:'Roboto Mono',monospace;
 font-size:12.5px;
 background:var(--bg);
}
.statement-box input:focus{outline:none;border-color:var(--blue)}
.statement-box button{
 width:100%;
 padding:11px;
 background:var(--blue);
 color:#fff;
 border:none;
 border-radius:8px;
 font-weight:700;
 font-size:12px;
 text-transform:uppercase;
 letter-spacing:.03em;
 cursor:pointer;
}
.statement-box button:active{background:var(--blue-dark)}

/* ===== LOADING OVERLAY ===== */
.loading-overlay{
 position:fixed;
 inset:0;
 background:rgba(255,255,255,.9);
 display:none;
 align-items:center;
 justify-content:center;
 z-index:200;
}
.spinner{
 width:38px;
 height:38px;
 border:4px solid var(--border);
 border-top:4px solid var(--blue);
 border-radius:50%;
 animation:spin .8s linear infinite;
}
@keyframes spin{100%{transform:rotate(360deg)}}

/* ===== INLINE ERROR / EMPTY STATE ===== */
.state-msg{
 text-align:center;
 font-size:12px;
 color:var(--text-faint);
 padding:24px 10px;
}
.state-msg.error{color:var(--red)}
.state-msg button{
 margin-top:10px;
 padding:8px 16px;
 background:var(--blue);
 color:#fff;
 border:none;
 border-radius:6px;
 font-size:11.5px;
 font-weight:700;
 text-transform:uppercase;
 letter-spacing:.03em;
 width:auto;
 cursor:pointer;
}

/* ===== BUTTON DISABLED ===== */
button:disabled{
 opacity:.6;
 cursor:not-allowed;
}

/* ===== LOGOUT CONFIRM MODAL ===== */
.modal-box p{
 font-size:12.5px;
 color:var(--text-soft);
 margin:10px 0 18px;
}
.modal-actions{
 display:flex;
 gap:8px;
}
.modal-actions button{
 flex:1;
 padding:11px;
 border:none;
 border-radius:8px;
 font-weight:700;
 font-size:12px;
 text-transform:uppercase;
 letter-spacing:.03em;
 cursor:pointer;
}
.modal-actions .cancel-btn{
 background:var(--bg);
 color:var(--text-soft);
 border:1px solid var(--border);
}
.modal-actions .confirm-btn{
 background:var(--red);
 color:#fff;
}
</style>

</head>

<body>

<div class="phone">

<!-- LOGIN -->
<div class="login" id="loginBox">
 <div class="login-box">
  <h2>SRCCS Login</h2>
  <input id="acc" placeholder="Account Number">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="err" id="err"></div>
 </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex:1;flex-direction:column">

<div class="header">
 <h1>🏦 SRCCS</h1>
 <span id="welcome"></span>
 <div class="top-actions">
  <input class="search" id="searchInput" placeholder="Search services">
  <div class="icon-btn" onclick="doSearch()">
   <i class="fa fa-search"></i>
  </div>
  <div class="icon-btn" onclick="askLogout()">
   <i class="fa fa-right-from-bracket"></i>
  </div>
 </div>
</div>

<div class="content" id="page"></div>

<div class="bottom">
 <div class="nav active" onclick="nav(this,'home')"><span>🏠</span>Home</div>
 <div class="nav" onclick="openHistory()"><span>⏱</span>History</div>
 <div class="nav" onclick="openStatement()"><span>📄</span>Statement</div>
 <div class="nav" onclick="nav(this,'loans')"><span>🏦</span>Loans</div>
 <div class="nav" onclick="nav(this,'profile')"><span>👤</span>Profile</div>
</div>

</div>
</div>

<!-- QR MODAL -->
<div class="modal" id="qrModal" onclick="this.style.display='none'">
 <div class="modal-box">
  <h3>Scan & Pay</h3>
  <i class="fa fa-qrcode" style="font-size:80px;color:#0b4fa2"></i>
 </div>
</div>

<!-- LOGOUT CONFIRM MODAL -->
<div class="modal" id="logoutModal">
 <div class="modal-box">
  <h3 style="margin:0">Logout?</h3>
  <p>Are you sure you want to log out of your SRCCS account?</p>
  <div class="modal-actions">
   <button class="cancel-btn" onclick="logoutModal.style.display='none'">Cancel</button>
   <button class="confirm-btn" onclick="logout()">Logout</button>
  </div>
 </div>
</div>

<!-- LOADING OVERLAY -->
<div class="loading-overlay" id="loadingOverlay">
 <div class="spinner"></div>
</div>


<script>
/* ================= APIs ================= */
const ACCOUNT_API = "https://script.google.com/macros/s/AKfycbwBkxKR8Zs9eEW0xaKdTME2EqGCnvgPdv3pSRcpWYO_7aW-Kxw7VVTeA342ZruLaiwe0w/exec";
const LOAN_API    = "https://script.google.com/macros/s/AKfycbx9ASrADhROLfc_aTjoWMPb7AacG2GfOs4bpiOB6khZqcrFusZRBUk7G6spPQH2GdF3/exec";

const page = document.getElementById("page");
let timer = null;

/* ================= CACHE (avoids reloading same data every click) ================= */
const appCache = {
 home: null,     // {balanceHTML, crHTML, drHTML, txnHTML}
 history: null,  // rendered historyBox HTML
 loans: null     // rendered loanBox HTML
};

/* ================= LOADING HELPER ================= */
function showLoading(){
 document.getElementById("loadingOverlay").style.display = "flex";
}
function hideLoading(){
 document.getElementById("loadingOverlay").style.display = "none";
}
function fmtAmount(n){
 const num = Number(n) || 0;
 return "₹ " + num.toLocaleString("en-IN");
}

/* ================= LOGIN ================= */
function login(){
 err.innerText = "";

 if(!acc.value.trim() || !pass.value){
  err.innerText = "Please enter account number and password";
  return;
 }

 const loginBtn = document.querySelector(".login-box button");
 loginBtn.disabled = true;
 loginBtn.innerText = "Logging in...";

 fetch(ACCOUNT_API,{
  method:"POST",
  body:JSON.stringify({
   action:"login",
   account: acc.value.trim(),
   password: pass.value
  })
 })
 .then(r=>r.json())
 .then(d=>{
  if(!d.success){
   err.innerText = d.message || "Invalid account number or password";
   return;
  }
  localStorage.setItem("srccs",JSON.stringify(d));
  start();
 })
 .catch(()=>{
  err.innerText = "Network error. Please check your connection and try again.";
 })
 .finally(()=>{
  loginBtn.disabled = false;
  loginBtn.innerText = "Login";
 });
}

/* ================= START ================= */
function start(){
 const d = JSON.parse(localStorage.getItem("srccs"));
 if(!d) return;

 loginBox.style.display = "none";
 app.style.display = "flex";
 welcome.innerText = "Welcome, " + d.name;

 loadHome();
 startLive();

 /* preload History & Loans silently so their tabs open instantly */
 prefetchHistory();
 prefetchLoans();
}

/* ================= HOME ================= */
function loadHome(){
 const d = JSON.parse(localStorage.getItem("srccs"));
 const c = appCache.home;

 page.innerHTML = `
 <div class="card">
  <div class="acc-type">My Savings A/c</div>
  <div class="acc-no">${d.customer.account}</div>
  <div class="balance" id="liveBal">${c ? c.balanceHTML : "₹ 0"}</div>

  <div style="display:flex;gap:12px;margin-top:10px">
   <div style="flex:1;background:#e8f5e9;border-radius:10px;padding:8px;text-align:center">
    <div style="font-size:11px;color:#166534">Credit</div>
    <b id="crAmt">${c ? c.crHTML : "₹ 0"}</b>
   </div>
   <div style="flex:1;background:#fdecea;border-radius:10px;padding:8px;text-align:center">
    <div style="font-size:11px;color:#991b1b">Debit</div>
    <b id="drAmt">${c ? c.drHTML : "₹ 0"}</b>
   </div>
  </div>

  <div class="mini-actions">
   <div class="mini" onclick="openHistory()"><div>⏱</div>History</div>
   <div class="mini" onclick="openStatement()"><div>📄</div>Statement</div>
   <div class="mini" onclick="openDepositPage()">
 <div>➕</div>Services
</div>

  </div>
 </div>

 <div class="section">
  <h3>Recent Transactions</h3>
  <div id="txnBox">${c ? c.txnHTML : ""}</div>
 </div>

 <div class="section">
  <h3>Payments</h3>
  <div class="grid">
   <div class="item" onclick="qrModal.style.display='flex'"><div>🔳</div>QR Pay</div>
   <div class="item" onclick="alert('Transfer Coming Soon')"><div>📤</div>Transfer</div>
   <div class="item"><div>🐖</div>FD</div>
   <div class="item"><div>💰</div>RD</div>
  </div>
 </div>
 `;
}

/* ================= LIVE BALANCE ================= */
function startLive(){
 clearInterval(timer);
 fetchLive();
 timer = setInterval(fetchLive,8000);
}

function fetchLive(){
 const d = JSON.parse(localStorage.getItem("srccs"));

 fetch(`${ACCOUNT_API}?fn=getStatement&account=${d.customer.account}`)
 .then(r=>r.json())
 .then(res=>{
  if(!res.success || !res.transactions) return;

  liveBal.innerText = fmtAmount(res.balance);

  let cr = 0, dr = 0;
  res.transactions.forEach(t=>{
   if(t.type==="credit") cr += Number(t.amount);
   if(t.type==="debit")  dr += Number(t.amount);
  });
  crAmt.innerText = fmtAmount(cr);
  drAmt.innerText = fmtAmount(dr);

  txnBox.innerHTML = "";

  if(res.transactions.length===0){
   txnBox.innerHTML = `<div class="state-msg">No transactions yet.</div>`;
   return;
  }

  res.transactions.slice(-5).reverse().forEach(t=>{
   txnBox.innerHTML += `
 <div class="txn ${t.type}">
  <div style="display:flex;justify-content:space-between">
   <b>${t.type.toUpperCase()}</b>
   <b style="color:${t.type==="credit"?"#16a34a":"#dc2626"}">${fmtAmount(t.amount)}</b>
  </div>

  <div style="font-size:11px;color:#6b7280">
   ${t.date} • Bal ${fmtAmount(t.balance)}
  </div>

  <div style="font-size:10px;color:#9ca3af">
   ID: ${t.id || "-"}
  </div>
 </div>
`;
  });

  /* save to cache so switching tabs shows this instantly next time */
  appCache.home = {
   balanceHTML: liveBal.innerText,
   crHTML: crAmt.innerText,
   drHTML: drAmt.innerText,
   txnHTML: txnBox.innerHTML
  };
 })
 .catch(()=>{
  const txnBoxEl = document.getElementById("txnBox");
  if(txnBoxEl && !appCache.home) txnBoxEl.innerHTML = `<div class="state-msg error">Unable to load latest balance. Retrying shortly…</div>`;
 });
}

/* ================= SEARCH ================= */
function doSearch(){
 const input = document.getElementById("searchInput");
 const q = input.value.trim().toLowerCase();
 if(!q){
  input.focus();
  return;
 }

 const routes = [
  { keys:["home","dashboard"], run:()=> setActiveNav(0, ()=>loadHome()) },
  { keys:["history","transaction","statement history"], run:()=> setActiveNav(1, openHistory) },
  { keys:["statement","download"], run:()=> setActiveNav(2, openStatement) },
  { keys:["loan","emi","loans"], run:()=> setActiveNav(3, ()=>loadLoans()) },
  { keys:["profile","account details","cibil","nominee"], run:()=> setActiveNav(4, ()=>loadProfile()) },
  { keys:["qr","scan","pay"], run:()=>{ document.getElementById("qrModal").style.display="flex"; } },
  { keys:["transfer"], run:()=> alert("Transfer Coming Soon") },
  { keys:["fd","fixed deposit"], run:()=> alert("FD — Coming Soon") },
  { keys:["rd","recurring deposit"], run:()=> alert("RD — Coming Soon") },
  { keys:["deposit","service","services"], run: openDepositPage },
  { keys:["logout","sign out"], run: askLogout }
 ];

 for(const r of routes){
  if(r.keys.some(k=> k.includes(q) || q.includes(k))){
   r.run();
   return;
  }
 }

 alert(`"${input.value}" ke liye koi matching service nahi mili.`);
}

function setActiveNav(index, fn){
 const navs = document.querySelectorAll(".nav");
 navs.forEach(n=>n.classList.remove("active"));
 if(navs[index]) navs[index].classList.add("active");
 fn();
}

/* ================= NAV ================= */
function nav(el,p){
 document.querySelectorAll(".nav").forEach(n=>n.classList.remove("active"));
 el.classList.add("active");

 if(p==="home")    loadHome();
 if(p==="loans")   loadLoans();
 if(p==="profile") loadProfile();
}

/* ================= LOANS (LOAN API) ================= */
/* ================= LOAN PAGE ================= */

/* ================= LOANS (FINAL – EMI BASED) ================= */

let emiTimer = null;

function loadLoans(){
 const d = JSON.parse(localStorage.getItem("srccs"));
 const cached = appCache.loans;

 page.innerHTML = `
  <div class="card">
   <h3>Loan & EMI Details</h3>
   <div id="loanBox" style="font-size:13px;color:#374151">${cached ? cached : "Loading..."}</div>
  </div>
 `;

 fetchLoanData()
 .then(result=>{
  const box = document.getElementById("loanBox");
  if(!box) return;

  box.innerHTML = result.html;
  appCache.loans = result.html;

  if(result.nextEmiDate){
   startEmiNotification(result.nextEmiDate, result.remainingEMI);
  }
 })
 .catch(()=>{
  const box = document.getElementById("loanBox");
  if(box && !appCache.loans) box.innerHTML = `<div class="state-msg error">Unable to load loan details. <button onclick="loadLoans()">Retry</button></div>`;
 });
}

/* ===== fetch + build loan HTML (used by loadLoans AND background prefetch after login) ===== */
function fetchLoanData(){
 const d = JSON.parse(localStorage.getItem("srccs"));

 return fetch(LOAN_API,{
  method:"POST",
  body:JSON.stringify({
   action:"searchLoan",
   q:d.customer.account
  })
 })
 .then(r=>r.json())
 .then(res=>{
  if(!res.found){
   return { html:`<div class="state-msg">No active loan found.</div>`, nextEmiDate:null, remainingEMI:0 };
  }

  /* ===== EMI BASED VALUES ===== */
  const emiAmount = Number(res.row.emi);
  const tenure    = Number(res.row.tenure);

  const paidEMI       = Array.isArray(res.emiHistory) ? res.emiHistory.length : 0;
  const remainingEMI  = tenure - paidEMI;

  const principal     = emiAmount * tenure;
  const outstanding   = emiAmount * remainingEMI;

  /* ===== NEXT EMI DATE (1st) ===== */
  const today = new Date();
  let nextEmiDate = new Date(today.getFullYear(), today.getMonth(), 1);
  if(today.getDate() > 1){
    nextEmiDate.setMonth(nextEmiDate.getMonth() + 1);
  }
  const nextEmiStr = nextEmiDate.toISOString().split("T")[0];

  /* ===== EMI ALERT ===== */
  let alertBox = "";
  const diffDays = Math.ceil(
   (nextEmiDate - today) / (1000 * 60 * 60 * 24)
  );

  if(remainingEMI > 0 && diffDays <= 3){
   alertBox = `
    <div style="
     background:#fee2e2;
     color:#991b1b;
     padding:8px;
     border-radius:10px;
     margin-bottom:10px;
     font-size:12px;
     font-weight:600">
     ⚠ EMI Due on ${nextEmiStr}
    </div>
   `;
  }

  /* ===== EMI HISTORY (WITH MODE) ===== */
  let emiHistoryHTML = "";

  if(res.emiHistory && res.emiHistory.length > 0){
   emiHistoryHTML = res.emiHistory.map((e,i)=>`
    <div style="
      background:#f3f4f6;
      padding:8px;
      border-radius:10px;
      margin:6px 0;
      font-size:12px">

      <div style="display:flex;justify-content:space-between">
        <b>EMI ${i+1}</b>
        <b>${fmtAmount(e.amount)}</b>
      </div>

      <div style="
        display:flex;
        justify-content:space-between;
        margin-top:4px;
        font-size:11px;
        color:#374151">

        <span>📅 ${e.date}</span>

        <span style="
          background:#e5e7eb;
          padding:2px 8px;
          border-radius:999px;
          font-weight:600">
          ${e.mode ? e.mode.toUpperCase() : "N/A"}
        </span>

      </div>
    </div>
   `).join("");
  }else{
   emiHistoryHTML = `
    <div style="font-size:12px;color:#6b7280">
     No EMI paid yet
    </div>
   `;
  }

  /* ===== FINAL UI ===== */
  const html = `
   ${alertBox}

   <b>Loan ID:</b> ${res.row.loan_id}<br>

   <b>Principal Amount:</b>
   <span style="font-weight:600;color:#0b4fa2">
    ${fmtAmount(principal)}
   </span><br>

   <b>Outstanding Amount:</b>
   <span style="color:#dc2626;font-weight:600">
    ${fmtAmount(outstanding)}
   </span><br><br>

   <b>EMI Amount:</b> ${fmtAmount(emiAmount)}<br>
   <b>Paid EMI:</b> ${paidEMI} / ${tenure}<br>
   <b>Remaining EMI:</b> ${remainingEMI}<br>
   <b>Next EMI Date:</b> ${nextEmiStr}<br>
   <b>Status:</b> ${res.row.status}<br><br>

   <b>EMI History:</b><br>
   ${emiHistoryHTML}
  `;

  return { html, nextEmiDate, remainingEMI };
 });
}

/* ================= EMI NOTIFICATION ================= */

function startEmiNotification(emiDate, remainingEMI){
 if(remainingEMI <= 0) return;

 if ("Notification" in window && Notification.permission !== "granted") {
  Notification.requestPermission();
 }

 clearInterval(emiTimer);

 function notify(){
  const today = new Date();
  const diff = Math.ceil(
   (emiDate - today) / (1000 * 60 * 60 * 24)
  );

  if(diff <= 3 && diff >= 0 && Notification.permission === "granted"){
   new Notification("🏦 SRCCS EMI Alert",{
    body:`Your EMI is due on ${emiDate.toISOString().split("T")[0]}`
   });
  }
 }

 notify();
 emiTimer = setInterval(notify, 12 * 60 * 60 * 1000);
}

/* ================= HISTORY ================= */
function openHistory(){
 const cached = appCache.history;

 page.innerHTML = `
  <div class="history-title">Transaction History</div>
  <div id="historyBox">${cached ? cached : '<div class="state-msg">Loading transactions…</div>'}</div>
 `;

 fetchHistoryData()
 .then(html=>{
  const box = document.getElementById("historyBox");
  if(box) box.innerHTML = html;
  appCache.history = html;
 })
 .catch(()=>{
  const box = document.getElementById("historyBox");
  if(box && !appCache.history) box.innerHTML = `<div class="state-msg error">Unable to load history. <button onclick="openHistory()">Retry</button></div>`;
 });
}

/* ===== fetch + build history HTML (used by openHistory AND background prefetch after login) ===== */
function fetchHistoryData(){
 const d = JSON.parse(localStorage.getItem("srccs"));

 return fetch(`${ACCOUNT_API}?fn=getStatement&account=${d.customer.account}`)
 .then(r=>r.json())
 .then(res=>{
  if(!res.success){
   return `<div class="state-msg error">Unable to load history.</div>`;
  }

  if(res.transactions.length===0){
   return `<div class="state-msg">No transactions found.</div>`;
  }

  return res.transactions.slice(-20).reverse().map(t=>`
    <div class="txn ${t.type}">
     <div class="txn-top">
      <div class="txn-type">${t.type.toUpperCase()}</div>
      <div class="txn-amt ${t.type}">${fmtAmount(t.amount)}</div>
     </div>
     <div class="txn-date">
 ${t.date} • Balance ${fmtAmount(t.balance)}
</div>

<div style="font-size:10px;color:#9ca3af">
 ID: ${t.id || "-"}
</div>
    </div>
   `).join("");
 });
}

function openStatement(){
 page.innerHTML = `
  <div class="statement-box">
   <h3 style="margin-top:0">Account Statement</h3>
   <label>From Date</label>
   <input type="date" id="fromDate">

   <button onclick="downloadStatement()">Download PDF Statement</button>
  </div>
 `;

function downloadStatement(){
 if(!fromDate.value || !toDate.value){
  alert("Please select both From and To dates");
  return;
 }
 if(fromDate.value > toDate.value){
  alert("'From Date' cannot be after 'To Date'");
  return;
 }

 const btn = document.querySelector(".statement-box button");
 btn.disabled = true;
 btn.innerText = "Preparing statement...";

 const d = JSON.parse(localStorage.getItem("srccs"));
 window.open(
  `${ACCOUNT_API}?fn=downloadStatement&account=${d.customer.account}&from=${fromDate.value}&to=${toDate.value}`,
  "_blank"
 );

 setTimeout(()=>{
  btn.disabled = false;
  btn.innerText = "Download PDF Statement";
 },1500);
}
